  <!-- Stats row -->
  <text x="80" y="480" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.45)">0&#8364; abonnement &#160;&#160;&#183;&#160;&#160; 100% donn&#233;es chez vous &#160;&#160;&#183;&#160;&#160; Open source &#160;&#160;&#183;&#160;&#160; Loi 1901</text>
